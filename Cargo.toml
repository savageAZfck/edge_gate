[package]
name = "edge_gate"
version = "0.1.0"
edition = "2021"
description = "Local LLM edge gateway: dedup, blind, filter, meter, audit"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
aho-corasick = "1.1"
lru = "0.12"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
hex = "0.4"
futures-util = "0.3"
regex = "1.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pipeline"
harness = false

[profile.release]
lto = true
codegen-units = 1
